# Cloudflare Worker for online campaigns. Deployed by .github/workflows/deploy.yml; run locally
# with `npm run dev:server` (put ACCESS_PASSWORD=... in server/.dev.vars).
name = "lotc-online"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://rffsilva.github.io,http://localhost:5173,http://localhost:4173"

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CampaignRoom"

# The free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate", "CampaignRoom"]
