# The site is built and published from main's workflow, which puts this classic game at the
# root and main's online version under /online. A push here asks main's workflow to rebuild.
name: Redeploy site

on:
  push:
    branches: [classic]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
